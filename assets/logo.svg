<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2b48;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Emblem Badge -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield -->
    <path d="M40 0 L75 14 L75 52 C75 72 40 85 40 85 C40 85 5 72 5 52 L5 14 Z" fill="url(#grad1)" stroke="#f59e0b" stroke-width="2.5" />
    <!-- Inner Stylized Elements -->
    <circle cx="40" cy="30" r="14" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path d="M40 18 L40 42 M28 30 L52 30" stroke="#f8fafc" stroke-width="2" />
    <polygon points="40,24 46,36 34,36" fill="#f59e0b" />
    <!-- Open Book / Wings at bottom -->
    <path d="M22 55 Q40 48 40 62 Q40 48 58 55 Q40 66 22 55 Z" fill="#ffffff" />
    <!-- Stars -->
    <circle cx="25" cy="42" r="1.5" fill="#f59e0b" />
    <circle cx="55" cy="42" r="1.5" fill="#f59e0b" />
    <circle cx="40" cy="68" r="2" fill="#38bdf8" />
  </g>

  <!-- Typography -->
  <text x="100" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#0f2b48" letter-spacing="1.5">IILM</text>
  <text x="175" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#1e40af" letter-spacing="0.5">UNIVERSITY</text>
  <rect x="100" y="47" width="280" height="2" fill="url(#gold)" />
  <text x="100" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0369a1" letter-spacing="1">GREATER NOIDA • ESTD. 1993</text>
  <text x="100" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#475569">School of Computer Science &amp; Engineering</text>
</svg>
